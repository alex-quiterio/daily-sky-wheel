name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp file versions with the commit id
        run: |
          v="${GITHUB_SHA::8}"
          sed -i "s/?v=dev/?v=$v/g" index.html
          sed -i "s/const VERSION = 'dev'/const VERSION = '$v'/" sw.js
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js src assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
